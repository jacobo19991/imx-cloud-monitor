<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMX Cloud Monitor 🚀</title>
    <!-- TailwindCSS via CDN para estilos rápidos y tema oscuro -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js para los gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom scrollbar para la tabla */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-dark text-slate-200 min-h-screen">
    
    <!-- Navbar -->
    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg border-b border-slate-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                <i class="fa-solid fa-robot text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">IMX Cloud Monitor</h1>
                <p class="text-xs text-slate-400">Trading Bot Dashboard</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span id="ping-outer" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
              <span id="ping-inner" class="relative inline-flex rounded-full h-3 w-3 bg-success"></span>
            </span>
            <span id="bot-status" class="text-sm font-semibold text-success">Online</span>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- USDT Balance -->
            <div class="glass-panel rounded-2xl p-6 shadow-lg transition-transform hover:-translate-y-1 duration-300">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-400 text-sm font-medium">Capital USDT</p>
                        <h3 id="usdt-balance" class="text-3xl font-bold text-white mt-1">$0.00</h3>
                    </div>
                    <div class="p-3 rounded-lg bg-emerald-500/20 text-emerald-400">
                        <i class="fa-solid fa-dollar-sign text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- IMX Balance -->
            <div class="glass-panel rounded-2xl p-6 shadow-lg transition-transform hover:-translate-y-1 duration-300">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-400 text-sm font-medium">Balance IMX</p>
                        <h3 id="imx-balance" class="text-3xl font-bold text-white mt-1">0.00</h3>
                    </div>
                    <div class="p-3 rounded-lg bg-blue-500/20 text-blue-400">
                        <i class="fa-solid fa-coins text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- PnL -->
            <div class="glass-panel rounded-2xl p-6 shadow-lg transition-transform hover:-translate-y-1 duration-300">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-400 text-sm font-medium">PnL Acumulado</p>
                        <h3 id="total-pnl" class="text-3xl font-bold text-white mt-1">$0.00</h3>
                    </div>
                    <div class="p-3 rounded-lg bg-purple-500/20 text-purple-400">
                        <i class="fa-solid fa-chart-line text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- Position Status -->
            <div class="glass-panel rounded-2xl p-6 shadow-lg transition-transform hover:-translate-y-1 duration-300">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-400 text-sm font-medium">Estado Posición</p>
                        <h3 id="position-status" class="text-xl font-bold text-slate-400 mt-2">CERRADA</h3>
                    </div>
                    <div class="p-3 rounded-lg bg-slate-500/20 text-slate-400" id="position-icon-bg">
                        <i id="position-icon" class="fa-solid fa-lock text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Gráfico Chart.js -->
            <div class="lg:col-span-2 glass-panel rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-white mb-4"><i class="fa-solid fa-chart-area mr-2 text-primary"></i>Evolución de Operaciones</h3>
                <div class="relative h-72 w-full">
                    <canvas id="tradesChart"></canvas>
                </div>
            </div>

            <!-- Tabla de Historial Reciente -->
            <div class="glass-panel rounded-2xl p-6 shadow-lg flex flex-col h-full">
                <h3 class="text-lg font-semibold text-white mb-4"><i class="fa-solid fa-clock-rotate-left mr-2 text-primary"></i>Últimos Trades</h3>
                <div class="overflow-y-auto flex-1 pr-2" style="max-height: 280px;">
                    <table class="w-full text-left text-sm">
                        <thead class="text-slate-400 sticky top-0 bg-[#1e293b] shadow-sm z-10">
                            <tr>
                                <th class="pb-3 pt-2 font-medium">Tipo</th>
                                <th class="pb-3 pt-2 font-medium text-right">Precio</th>
                                <th class="pb-3 pt-2 font-medium text-right">Cantidad</th>
                            </tr>
                        </thead>
                        <tbody id="trades-tbody" class="divide-y divide-slate-700/50">
                            <!-- Los trades se inyectarán aquí vía JS -->
                            <tr><td colspan="3" class="text-center py-4 text-slate-500">Cargando operaciones...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let tradesChart = null;

        // Formateadores
        const formatMoney = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
        const formatCrypto = (val) => Number(val).toFixed(2);
        const formatDate = (isoString) => {
            const d = new Date(isoString);
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        };

        // Inicializar Gráfico Chart.js
        function initChart() {
            const ctx = document.getElementById('tradesChart').getContext('2d');
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Inter';

            tradesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Precio de Ejecución ($)',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        pointBackgroundColor: [],
                        pointBorderColor: '#fff',
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return `Precio: $${context.parsed.y}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                            ticks: { callback: (value) => '$' + value }
                        },
                        x: {
                            grid: { display: false, drawBorder: false }
                        }
                    }
                }
            });
        }

        // Obtener y actualizar Datos
        async function fetchDashboardData() {
            try {
                // 1. Fetch Status
                const resStatus = await fetch('/api/status');
                const dataStatus = await resStatus.json();
                
                if (dataStatus.status === 'online') {
                    document.getElementById('usdt-balance').innerText = formatMoney(dataStatus.usdt_balance);
                    document.getElementById('imx-balance').innerText = formatCrypto(dataStatus.imx_balance);
                    
                    const pnlEl = document.getElementById('total-pnl');
                    pnlEl.innerText = formatMoney(dataStatus.total_profit);
                    if (dataStatus.total_profit > 0) pnlEl.className = "text-3xl font-bold text-success mt-1";
                    else if (dataStatus.total_profit < 0) pnlEl.className = "text-3xl font-bold text-danger mt-1";

                    // Estado Posición
                    const posEl = document.getElementById('position-status');
                    const posIconBg = document.getElementById('position-icon-bg');
                    const posIcon = document.getElementById('position-icon');
                    
                    if (dataStatus.has_open_position) {
                        posEl.innerText = "ABIERTA";
                        posEl.className = "text-xl font-bold text-success mt-2";
                        posIconBg.className = "p-3 rounded-lg bg-success/20 text-success";
                        posIcon.className = "fa-solid fa-lock-open text-xl animate-pulse";
                    } else {
                        posEl.innerText = "CERRADA";
                        posEl.className = "text-xl font-bold text-slate-400 mt-2";
                        posIconBg.className = "p-3 rounded-lg bg-slate-500/20 text-slate-400";
                        posIcon.className = "fa-solid fa-lock text-xl";
                    }
                }

                // 2. Fetch Trades
                const resTrades = await fetch('/api/trades');
                const dataTrades = await resTrades.json();
                
                if (dataTrades.trades) {
                    // Ordenar cronológicamente para el gráfico (vienen DESC desde la BD)
                    const cronoTrades = [...dataTrades.trades].reverse();
                    
                    // Actualizar Gráfico
                    const labels = cronoTrades.map(t => formatDate(t.timestamp));
                    const prices = cronoTrades.map(t => t.price);
                    const pointColors = cronoTrades.map(t => t.side === 'BUY' ? '#10b981' : '#ef4444');
                    
                    tradesChart.data.labels = labels;
                    tradesChart.data.datasets[0].data = prices;
                    tradesChart.data.datasets[0].pointBackgroundColor = pointColors;
                    tradesChart.update();

                    // Actualizar Tabla (usamos el orden original DESC, más recientes arriba)
                    const tbody = document.getElementById('trades-tbody');
                    tbody.innerHTML = '';
                    
                    dataTrades.trades.slice(0, 15).forEach(trade => {
                        const isBuy = trade.side === 'BUY';
                        const typeClass = isBuy ? 'text-success bg-success/10' : 'text-danger bg-danger/10';
                        const typeIcon = isBuy ? 'fa-arrow-turn-up' : 'fa-arrow-turn-down';
                        
                        const tr = document.createElement('tr');
                        tr.className = "group hover:bg-slate-800/50 transition-colors";
                        tr.innerHTML = `
                            <td class="py-3">
                                <span class="px-2 py-1 rounded text-xs font-bold ${typeClass}">
                                    <i class="fa-solid ${typeIcon} mr-1"></i>${trade.side}
                                </span>
                                <div class="text-[10px] text-slate-500 mt-1">${formatDate(trade.timestamp)}</div>
                            </td>
                            <td class="py-3 text-right font-medium text-white">${formatMoney(trade.price)}</td>
                            <td class="py-3 text-right text-slate-300">${formatCrypto(trade.amount)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                    
                    if (dataTrades.trades.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-slate-500 italic">No hay operaciones aún</td></tr>';
                    }
                }

            } catch (error) {
                console.error("Error fetching dashboard data:", error);
                document.getElementById('bot-status').innerText = "Offline";
                document.getElementById('bot-status').className = "text-sm font-semibold text-danger";
                document.getElementById('ping-outer').classList.remove('animate-ping');
                document.getElementById('ping-outer').classList.replace('bg-success', 'bg-danger');
                document.getElementById('ping-inner').classList.replace('bg-success', 'bg-danger');
            }
        }

        // Iniciar
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            fetchDashboardData();
            // Refrescar cada 5 segundos
            setInterval(fetchDashboardData, 5000);
        });
    </script>
</body>
</html>
