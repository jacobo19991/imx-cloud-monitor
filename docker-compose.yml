version: '3.8'

services:
  trading-engine:
    build: .
    container_name: imx_trading_engine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python -m src.main
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[p]ython -m src.main' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-dashboard:
    build: .
    container_name: imx_web_dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: python -m uvicorn src.dashboard:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - trading-engine
