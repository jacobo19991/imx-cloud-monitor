version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: imx_postgres
    restart: always
    environment:
      POSTGRES_USER: imx_user
      POSTGRES_PASSWORD: imx_password
      POSTGRES_DB: imx_trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imx_user -d imx_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  trading-engine:
    build: .
    container_name: imx_trading_engine
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://imx_user:imx_password@db:5432/imx_trading
    volumes:
      - ./logs:/app/logs
    command: python -m src.main
    depends_on:
      db:
        condition: service_healthy

  web-dashboard:
    build: .
    container_name: imx_web_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://imx_user:imx_password@db:5432/imx_trading
    ports:
      - "8000:8000"
    command: uvicorn src.dashboard:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: imx_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: imx_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  prom_data:
  grafana_data:
